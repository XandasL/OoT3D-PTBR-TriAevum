name: v1.3.0 experimental build (no release)
on:
  workflow_dispatch:
  push:
    branches: [feat/v1.3.0-full-ptbr-native-textures]
    paths: ['installer/**', 'test_v130*.py', 'test_font_mode.py', '.github/workflows/**']
permissions:
  contents: read
concurrency:
  group: v130-experimental-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Linux headless prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk binutils xvfb
      - run: python -m pip install -r installer/requirements-v1.3-build.txt
      - name: Verify original translation payload
        run: python installer/build_installer.py --prepare-only
      - name: Windows recovery gate, build and packaged self-test
        if: runner.os == 'Windows'
        run: python installer/build_installer.py
      - name: Linux recovery gate, build and packaged self-test
        if: runner.os == 'Linux'
        run: xvfb-run -a python installer/build_installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: OoT3D-PTBR-v1.3.0-${{ runner.os }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
