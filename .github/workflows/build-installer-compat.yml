name: Build instalador PT-BR 0.8 e anexar ao draft
on:
  workflow_dispatch:
  push:
    branches: [compat/triaevum-0.8.0-beta.1]
    paths:
      - "installer/**"
      - "test_compat_safety.py"
      - ".github/workflows/build-installer-compat.yml"
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: Windows-x64
          - os: ubuntu-22.04
            label: Linux-x86_64-AppImage-Flatpak
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Dependências Linux para Tk e empacotamento
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk binutils xvfb
      - name: Dependências de build
        run: python -m pip install -r installer/requirements-build.txt
      - name: Obter e validar os 112 recursos da tradução
        run: python installer/build_installer.py --prepare-only
      - name: Testes de segurança e conversão
        run: python test_compat_safety.py
      - name: Build Windows e autoteste do executável
        if: runner.os == 'Windows'
        run: python installer/build_installer.py
      - name: Build Linux e autoteste de Tk sem monitor
        if: runner.os == 'Linux'
        run: xvfb-run -a python installer/build_installer.py
      - name: Upload Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: OoT3D-PTBR-v1.1.0-Windows-x64
          path: artifacts/*Windows-x64*
          if-no-files-found: error
      - name: Upload Linux AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: OoT3D-PTBR-v1.1.0-Linux-x86_64-AppImage
          path: artifacts/*Linux-x86_64-AppImage*
          if-no-files-found: error
      - name: Upload Linux Flatpak
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: OoT3D-PTBR-v1.1.0-Linux-x86_64-Flatpak
          path: artifacts/*Linux-x86_64-Flatpak*
          if-no-files-found: error
  attach-draft:
    name: Anexar pacotes ao draft existente (sem publicar)
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: OoT3D-PTBR-v1.1.0-*
          merge-multiple: true
          path: release-assets
      - name: Confirmar draft e anexar ZIPs e checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="1.1.0"
          RELEASE_ID=$(gh api "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.tag_name == "1.1.0" and .draft == true and .prerelease == true) | .id' | head -n 1)
          test -n "$RELEASE_ID" || { echo "Draft 1.1.0 nao encontrado"; exit 1; }
          test "$(find release-assets -maxdepth 1 -name '*.zip' | wc -l)" -eq 3
          test "$(find release-assets -maxdepth 1 -name '*.sha256' | wc -l)" -eq 3
          for file in release-assets/*.zip release-assets/*.sha256; do
            name=$(basename "$file")
            old_id=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets?per_page=100" --jq ".[] | select(.name == \"$name\") | .id" | head -n 1)
            if [ -n "$old_id" ]; then
              gh api -X DELETE "repos/$GH_REPO/releases/assets/$old_id"
            fi
            gh api -X POST -H "Content-Type: application/octet-stream" --input "$file" "https://uploads.github.com/repos/$GH_REPO/releases/$RELEASE_ID/assets?name=$name" >/dev/null
            echo "Anexado: $name"
          done
          echo "Draft atualizado; publicacao permanece manual."
