name: Build instalador PT-BR 0.8 e anexar ao draft
on:
  workflow_dispatch:
  push:
    branches: [compat/triaevum-0.8.0-beta.1]
    paths:
      - "installer/**"
      - "test_compat_safety.py"
      - ".github/workflows/build-installer-compat.yml"
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: Windows-x64
          - os: ubuntu-22.04
            label: Linux-x86_64-AppImage-Flatpak
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Dependências Linux para Tk e empacotamento
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk binutils xvfb
      - name: Dependências de build
        run: python -m pip install -r installer/requirements-build.txt
      - name: Obter e validar os 112 recursos da tradução
        run: python installer/build_installer.py --prepare-only
      - name: Testes de segurança e conversão
        run: python test_compat_safety.py
      - name: Build Windows e autoteste do executável
        if: runner.os == 'Windows'
        run: python installer/build_installer.py
      - name: Build Linux e autoteste de Tk sem monitor
        if: runner.os == 'Linux'
        run: xvfb-run -a python installer/build_installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: OoT3D-PTBR-v1.1.0-${{ matrix.label }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

  attach-draft:
    name: Anexar pacotes ao draft existente (sem publicar)
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: OoT3D-PTBR-v1.1.0-*
          merge-multiple: true
          path: release-assets
      - name: Confirmar draft e anexar ZIPs e checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="1.1.0"
          RELEASE=$(gh api "repos/$GH_REPO/releases/tags/$TAG")
          echo "$RELEASE" | jq -e '.draft == true and .prerelease == true' >/dev/null
          test "$(find release-assets -maxdepth 1 -name '*.zip' | wc -l)" -eq 3
          gh release upload "$TAG" release-assets/*.zip release-assets/*.sha256 --clobber
          echo "Arquivos anexados ao draft $TAG. Publicacao permanece manual."
