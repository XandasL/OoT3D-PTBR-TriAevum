name: Experimental installer with embedded Noto Sans
on:
  push:
    branches: [feat/independent-ptbr-hd-font]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: Windows-x64
          - os: ubuntu-22.04
            platform: Linux-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r installer/requirements-build.txt
      - name: Linux GUI prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk binutils xvfb
      - name: Obtain upstream Noto Sans and OFL license
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import urllib.request
          folder = Path('build/open-font')
          folder.mkdir(parents=True, exist_ok=True)
          base = 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosans/'
          for name in ('NotoSans[wdth,wght].ttf', 'OFL.txt'):
              path = folder / name
              path.write_bytes(urllib.request.urlopen(base + urllib.parse.quote(name), timeout=45).read())
              print(name, len(path.read_bytes()), hashlib.sha256(path.read_bytes()).hexdigest())
          assert b'SIL OPEN FONT LICENSE' in (folder / 'OFL.txt').read_bytes().upper()
      - name: Validate original payload
        run: python installer/build_installer.py --prepare-only --open-font "build/open-font/NotoSans[wdth,wght].ttf"
      - name: QBF unit tests and installed-source checks
        run: python -m unittest test_qbf_coverage test_open_font_atlas test_open_hd_qbf test_open_font_pack_integration test_font_mode test_compat_safety test_hd_integration -v
      - name: Build experimental Windows EXE
        if: runner.os == 'Windows'
        run: python installer/build_installer.py --open-font "build/open-font/NotoSans[wdth,wght].ttf"
      - name: Build experimental Linux executable
        if: runner.os == 'Linux'
        run: xvfb-run -a python installer/build_installer.py --open-font "build/open-font/NotoSans[wdth,wght].ttf"
      - uses: actions/upload-artifact@v4
        with:
          name: Experimental-Noto-Sans-${{ matrix.platform }}
          path: |
            artifacts/*.zip
            artifacts/*.sha256
            artifacts/*-self-test.json
          if-no-files-found: error
          retention-days: 14
# This workflow never creates or modifies GitHub Releases.
