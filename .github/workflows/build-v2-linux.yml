name: v2 PT-BR - Linux AppImage e Flatpak (experimental)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar scripts e testes Linux
        run: |
          python -m unittest discover -s experiments/portable-v2-clean -p "test_*.py" -v
          bash -n experiments/portable-v2-clean/Ativar-PTBR-Linux.sh
      - name: Obter ZIP completo da Draft Release pela API
        env:
          GH_TOKEN: ${{ secrets.V2_RELEASE_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Configure o segredo V2_RELEASE_READ_TOKEN com acesso de leitura a Contents deste repositorio para acessar a draft privada."
            exit 1
          fi
          # gh release download nao enxerga drafts; listar releases pela API e localizar o asset.
          asset_id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == true and .tag_name == "2.0") | .assets[] | select(.name == "OoT3D-PTBR-v2.0-Beta.zip") | .id' | head -n 1)"
          if [[ ! "$asset_id" =~ ^[0-9]+$ ]]; then
            echo "::error::O ZIP completo nao foi encontrado na draft 2.0; confira a permissao do token para visualizar releases em rascunho."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
            -H "Accept: application/octet-stream" \
            > incoming/OoT3D-PTBR-v2.0-Beta.zip
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          source = Path("incoming/OoT3D-PTBR-v2.0-Beta.zip")
          with ZipFile(source) as z:
              if z.testzip() is not None:
                  raise ValueError("ZIP de entrada corrompido")
          print("Draft asset OK:", source.stat().st_size, "bytes")
          PY
      - name: Gerar ZIPs Linux com O3RO validado
        shell: bash
        run: |
          python experiments/portable-v2-clean/build_linux_packages.py \
            --entrada incoming/OoT3D-PTBR-v2.0-Beta.zip --saida dist
          sha256sum dist/*.zip > dist/SHA256SUMS.txt
      - name: Arquivos Linux para teste (nao publica release)
        uses: actions/upload-artifact@v4
        with:
          name: OoT3D-PTBR-v2-Linux-Experimental
          path: dist/*
          if-no-files-found: error
          retention-days: 14
