name: INSPEÇÃO temporária — identidade do runtime beta.1.1
on:
  push:
    branches: [test/beta-1.1-hd-font-detection]
    paths:
      - '.github/workflows/inspect-beta11-runtime.yml'
permissions:
  contents: read
jobs:
  hashes:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baixar o pacote oficial e verificar SHA-256 publicado
        run: |
          python - <<'PY'
          import hashlib, json, urllib.request, zipfile
          from pathlib import Path
          url = "https://github.com/coccofresco/TriAevum/releases/download/v0.8.0-beta.1.1/TriAevum-v0.8.0-beta.1.1-Windows-x64.zip"
          expected_archive = "983c1f3f32070e9490376a2a2e6a1bd6617b526624cbef77c343abfe0232af3f"
          archive = Path("TriAevum-beta11-Windows-x64.zip")
          request = urllib.request.Request(url, headers={"User-Agent":"PTBR-runtime-verification"})
          h = hashlib.sha256()
          with urllib.request.urlopen(request, timeout=120) as response, archive.open("wb") as out:
              while True:
                  block = response.read(4*1024*1024)
                  if not block: break
                  h.update(block); out.write(block)
          if h.hexdigest() != expected_archive:
              raise SystemExit(f"Archive SHA mismatch: {h.hexdigest()}")
          wanted = {
              "TriAevum.exe", "shaderc_shared.dll", "triaevum_title_aot.dll",
              "triaevum_immerse.dll", "triaevum_dlss.dll", "amd_fidelityfx_vk.dll",
              "nvngx_dlss.dll"
          }
          result = {"release":"v0.8.0-beta.1.1","archive_sha256":h.hexdigest(),"files":{}}
          with zipfile.ZipFile(archive) as z:
              candidates = {}
              for n in z.namelist():
                  if not n.endswith("/"):
                      base = n.rsplit("/",1)[-1]
                      if base in wanted: candidates.setdefault(base,[]).append(n)
              for name in sorted(wanted):
                  paths = candidates.get(name, [])
                  if len(paths) != 1:
                      raise SystemExit(f"Expected one {name}, found: {paths}")
                  data = z.read(paths[0])
                  result["files"][name] = {
                      "path":paths[0],"size":len(data),
                      "sha256":hashlib.sha256(data).hexdigest()
                  }
          Path("beta11-runtime-identities.json").write_text(json.dumps(result,indent=2)+"\\n")
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: beta11-runtime-identities
          path: beta11-runtime-identities.json
          if-no-files-found: error
          retention-days: 7
